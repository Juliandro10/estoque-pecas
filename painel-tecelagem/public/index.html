<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0e1218" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Tecelagem" />
    <title>Tecelagem</title>
    <link rel="stylesheet" href="./painel.css?v=12" />
  </head>
  <body>
    <header class="top">
      <div>
        <h1 id="titulo">Tecelagem</h1>
        <p class="sub" id="resumo">Lendo o quadro…</p>
      </div>
      <div class="top-right">
        <nav class="modos" aria-label="Telas">
          <button type="button" class="modo on" data-modo="tecelagem">Tecelagem</button>
          <button type="button" class="modo" data-modo="desenv">Desenvolvimento</button>
        </nav>
        <button type="button" class="ficha-custo-top" id="btn-ficha-custo">Ficha de custos</button>
        <div class="clock" id="relogio"></div>
      </div>
    </header>
    <p class="aviso" id="aviso" hidden></p>
    <section id="view-tecelagem">
      <section class="maquinas" id="maquinas"></section>
      <section class="espera">
        <h2>Em espera · sugestão (por prazo)</h2>
        <p class="nota">Não está lançado nessa máquina. É só a próxima que cabe na galga.</p>
        <div class="espera-list" id="espera"></div>
      </section>
    </section>
    <section id="view-desenv" hidden>
      <nav class="abas" id="desenv-abas"></nav>
      <div class="desenv-lista" id="desenv-lista"></div>
    </section>
    <script src="./firebase-config.js"></script>
    <script src="./painel.js?v=12"></script>
  </body>
</html>
