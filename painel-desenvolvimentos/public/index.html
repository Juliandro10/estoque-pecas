<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0e1218" />
    <title>Desenvolvimentos</title>
    <link rel="stylesheet" href="./desenv.css?v=10" />
  </head>
  <body>
    <div id="login" class="login" hidden>
      <form class="login-card" id="login-form">
        <h1>Desenvolvimentos</h1>
        <p>Usuário dos setores. Não é o Estoque de Peças.</p>
        <label>Usuário</label>
        <input id="login-email" type="text" value="desenvolvimento" required autocomplete="username" />
        <label>Senha</label>
        <input id="login-pass" type="password" required autocomplete="current-password" />
        <p class="erro" id="login-erro"></p>
        <button type="submit">Entrar</button>
      </form>
    </div>
    <div id="app" hidden>
      <header class="top">
        <div>
          <h1>Desenvolvimentos</h1>
          <p class="sub" id="resumo">O modelo passa de aba em aba com o OK do setor</p>
        </div>
        <div class="top-acoes">
          <span class="user" id="user-email"></span>
          <button type="button" class="btn ghost" id="btn-sair" hidden>Sair</button>
          <button type="button" class="btn ghost" id="btn-syntech" hidden>Do Syntech</button>
          <button type="button" class="btn" id="btn-novo">Novo desenvolvimento</button>
        </div>
      </header>
      <p class="aviso" id="aviso" hidden></p>
      <nav class="abas" id="abas"></nav>
      <section class="lista" id="lista"></section>
    </div>
    <div id="dlg-syntech" class="dlg" hidden>
      <div class="dlg-card dlg-wide">
        <h2>Cadastrados no Syntech, sem programa</h2>
        <p class="hint">Produto já existe no Syntech, mas ainda não foi desenvolvido.</p>
        <input id="syn-busca" maxlength="40" placeholder="Buscar referência ou nome" />
        <p class="erro" id="syn-erro"></p>
        <div class="syn-lista" id="syn-lista"></div>
        <div class="dlg-acoes">
          <button type="button" class="btn ghost" id="syn-fechar">Fechar</button>
        </div>
      </div>
    </div>
    <div id="dlg" class="dlg" hidden>
      <form class="dlg-card" id="dlg-form">
        <h2 id="dlg-title">Novo desenvolvimento</h2>
        <label for="f-ref">Referência</label>
        <input id="f-ref" maxlength="13" placeholder="Ex.: 5612" />
        <p class="hint" id="f-ref-hint"></p>
        <label for="f-nome">Modelo / nome</label>
        <input id="f-nome" required maxlength="80" placeholder="Ex.: Mini saia longa" />
        <label for="f-cliente">Cliente</label>
        <input id="f-cliente" maxlength="60" placeholder="Opcional" />
        <label for="f-setor">Setor</label>
        <select id="f-setor"></select>
        <label for="f-tipo">O que é</label>
        <select id="f-tipo"></select>
        <div id="f-tipo-outro-wrap" hidden>
          <label for="f-tipo-texto">Outro (escreva)</label>
          <input id="f-tipo-texto" maxlength="40" placeholder="Ex.: piloto, feira…" />
        </div>
        <label for="f-obs">Observação</label>
        <textarea id="f-obs" maxlength="400" placeholder="Prazo, quem pediu, detalhe do ajuste…"></textarea>
        <p class="erro" id="dlg-erro"></p>
        <div class="dlg-acoes">
          <button type="submit" class="btn go">Salvar</button>
          <button type="button" class="btn ghost" id="dlg-cancelar">Cancelar</button>
        </div>
      </form>
    </div>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
    <script src="./firebase-config.js"></script>
    <script src="./desenv.js?v=10"></script>
  </body>
</html>
